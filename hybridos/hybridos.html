/* ============ 系统安装引导（与系统结合） ============ */
const btSteps=['欢迎','安装选项','正在安装','安装完成'];
let btStep=0, btMode='标准安装';
function showBoot(force){
  const boot=document.getElementById('boot');
  if(!boot) return;
  if(force) btStep=0;
  boot.classList.add('on');
  renderBoot();
}
function hideBoot(){ const b=document.getElementById('boot'); if(b) b.classList.remove('on'); }
function renderBoot(){
  const boot=document.getElementById('boot');
  const st=boot.querySelector('#bt-steps');
  st.innerHTML=btSteps.map((s,i)=>{ const on=i===btStep, done=i<btStep;
    return `<div class="bt-step ${on?'on':''} ${done?'done':''}"><div class="bt-dot">${done?'✓':i+1}</div>${s}</div>${i<btSteps.length-1?`<div class="bt-bar"><i style="width:${done||on?'100%':'0'}"></i></div>`:''}`;
  }).join('');
  const body=boot.querySelector('#bt-body');
  if(btStep===0){
    body.innerHTML=`<div class="bt-logo">${IC.update}</div><h1>安装 HybridOS</h1><div class="bt-sub">鸿蒙风格 · 融合 macOS 与 Windows 的双系统桌面<br>安装完成后将进入系统桌面</div><button class="bt-btn" id="bt-next">开始安装</button>`;
    boot.querySelector('#bt-next').addEventListener('click',()=>{ btStep=1; renderBoot(); });
  } else if(btStep===1){
    body.innerHTML=`<h1>选择安装方式</h1><div class="bt-sub">根据需要选择安装类型</div>
      <div class="bt-opts"><div class="bt-opt sel" data-m="标准安装"><b>标准安装</b><span>完整的系统功能与所有预装应用</span></div>
      <div class="bt-opt" data-m="精简安装"><b>精简安装</b><span>仅保留核心功能，体积更小更流畅</span></div></div>
      <div style="display:flex;gap:10px"><button class="bt-btn ghost" id="bt-back">上一步</button><button class="bt-btn" id="bt-next">继续</button></div>`;
    body.querySelectorAll('.bt-opt').forEach(o=>o.addEventListener('click',()=>{ body.querySelectorAll('.bt-opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); btMode=o.dataset.m; }));
    boot.querySelector('#bt-back').addEventListener('click',()=>{ btStep=0; renderBoot(); });
    boot.querySelector('#bt-next').addEventListener('click',()=>{ btStep=2; renderBoot(); runBootInstall(); });
  } else if(btStep===2){
    body.innerHTML=`<div class="bt-ring"><svg class="bt-bg" viewBox="0 0 160 160"><circle cx="80" cy="80" r="70"/></svg><svg class="bt-fg" viewBox="0 0 160 160"><circle cx="80" cy="80" r="70" stroke-dasharray="439.8" stroke-dashoffset="439.8"/></svg><div class="bt-pct" id="bt-pct">0<em>%</em></div></div>
      <div class="bt-stage" id="bt-stage">正在准备安装…</div><div class="bt-flist" id="bt-flist"></div>`;
  } else {
    body.innerHTML=`<div class="bt-logo ok"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1>安装成功</h1><div class="bt-sub">HybridOS 已安装完成<br>重启后将进入全新桌面</div><button class="bt-btn" id="bt-reboot">立即重启</button>`;
    boot.querySelector('#bt-reboot').addEventListener('click',()=>enterDesktop());
  }
}
function runBootInstall(){
  const files=btMode==='标准安装'?['准备磁盘与文件','写入系统核心','安装系统应用','优化系统服务','配置网络与账户']:['准备磁盘与文件','写入系统核心','优化系统服务'];
  const fl=document.getElementById('bt-flist');
  files.forEach(f=>fl.insertAdjacentHTML('beforeend',`<div><span class="ok">✓</span><span>${f}</span></div>`));
  const fg=document.querySelector('.bt-ring .bt-fg circle'), pct=document.getElementById('bt-pct'), stage=document.getElementById('bt-stage');
  const C=439.8; fg.style.strokeDashoffset=C;
  let p=0, doneIdx=0;
  const iv=setInterval(()=>{
    p+=Math.random()*4+1.2;
    if(p>=100){ p=100; clearInterval(iv); stage.textContent='安装完成，正在进入系统…';
      setTimeout(()=>{ btStep=3; renderBoot(); },800); return; }
    fg.style.strokeDashoffset=C*(1-p/100);
    pct.innerHTML=Math.floor(p)+'<em>%</em>';
    const idx=Math.min(files.length-1, Math.floor(p/100*files.length));
    if(idx>doneIdx){ doneIdx=idx; fl.children[idx].querySelector('span:last-child').classList.add('on'); }
    stage.textContent=idx<files.length-1?files[idx]:'正在完成安装…';
  },160);
}
function enterDesktop(){
  hideBoot();
  try{ if(localStorage) localStorage.setItem('hybridos_installed','1'); }catch(e){}
  showLogin();
}

/* ============ 登录（开机验证 + 注册账户） ============ */
let _lgTimer=null;
function loadUsers(){
  try{ return JSON.parse(localStorage.getItem('hybridos_users')||'{"admin":"admin123"}'); }
  catch(e){ return {"admin":"admin123"}; }
}
function saveUsers(u){ try{ localStorage.setItem('hybridos_users',JSON.stringify(u)); }catch(e){} }
function showLogin(){
  const l=document.getElementById('login'); if(!l) return;
  l.classList.add('on');
  setLoginView('login');
  tickClock();
  if(_lgTimer) clearInterval(_lgTimer);
  _lgTimer=setInterval(tickClock,1000);
  document.getElementById('lg-uname').value='';
  document.getElementById('lg-pass').value='';
  const tip=document.getElementById('lg-tip'); tip.style.opacity='0'; tip.textContent='';
  setTimeout(()=>document.getElementById('lg-uname').focus(),120);
}
function setLoginView(v){
  document.getElementById('lg-view-login').style.display = v==='login'?'flex':'none';
  document.getElementById('lg-view-reg').style.display = v==='reg'?'flex':'none';
}
function tickClock(){
  const d=new Date();
  document.getElementById('lg-clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  document.getElementById('lg-date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'[d.getDay()];
}
function tipMsg(msg,ok){
  const tip=document.getElementById('lg-tip');
  tip.textContent=msg; tip.style.color=ok?'#5ee6a0':'#ff6b6b'; tip.style.opacity='1';
  setTimeout(()=>{ tip.style.opacity='0'; },2200);
}
function tryLogin(){
  const users=loadUsers();
  const uname=document.getElementById('lg-uname').value.trim();
  const pass=document.getElementById('lg-pass').value;
  if(uname && users[uname] && users[uname]===pass){
    loginSuccess(uname);
  } else {
    tipMsg('用户名或密码错误');
    document.getElementById('lg-pass').value='';
    document.getElementById('lg-pass').focus();
  }
}
function loginSuccess(uname){
  if(_lgTimer) clearInterval(_lgTimer);
  document.getElementById('login').classList.remove('on');
  document.getElementById('lg-avatar').textContent=(uname[0]||'H').toUpperCase();
  toast('欢迎回来，'+uname);
  setTimeout(()=>openApp('finder'),350);
  setTimeout(()=>openApp('browser'),650);
}
function registerUser(){
  const u=document.getElementById('rg-uname').value.trim();
  const p=document.getElementById('rg-pass').value;
  const p2=document.getElementById('rg-pass2').value;
  if(!u||!p){ tipMsg('用户名和密码不能为空'); return; }
  if(p.length<4){ tipMsg('密码至少 4 位'); return; }
  if(p!==p2){ tipMsg('两次密码不一致'); return; }
  const users=loadUsers();
  if(users[u]){ tipMsg('用户名已存在'); return; }
  users[u]=p; saveUsers(users);
  document.getElementById('lg-uname').value=u;
  setLoginView('login');
  tipMsg('注册成功，请登录', true);
  setTimeout(()=>document.getElementById('lg-pass').focus(),100);
}
document.getElementById('lg-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') tryLogin(); });
document.getElementById('lg-uname').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('lg-pass').focus(); });
document.getElementById('lg-enter').addEventListener('click',tryLogin);
document.getElementById('lg-reg').addEventListener('click',()=>{ setLoginView('reg'); document.getElementById('rg-uname').focus(); });
document.getElementById('rg-back').addEventListener('click',()=>{ setLoginView('login'); });
document.getElementById('rg-do').addEventListener('click',registerUser);
document.getElementById('rg-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('rg-pass2').focus(); });
document.getElementById('rg-pass2').addEventListener('keydown',e=>{ if(e.key==='Enter') registerUser(); });
</script>
