name: Build 550W Lite Desktop

on:
  push:
    paths:
      - 'desktop-lite/**'
      - '550w.html'
      - 'assets/**'

jobs:
  build-windows-lite:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync latest 550w.html
        shell: cmd
        run: |
          copy /Y 550w.html desktop-lite\app\550w.html
          if not exist desktop-lite\app\assets mkdir desktop-lite\app\assets
          copy /Y assets\550w-icon-192.png desktop-lite\app\assets\
          copy /Y assets\550w-icon-512.png desktop-lite\app\assets\

      - name: Install dependencies
        working-directory: desktop-lite
        run: |
          pip install pywebview==5.1 pyinstaller

      - name: Build with PyInstaller
        working-directory: desktop-lite
        run: pyinstaller --noconfirm --clean --windowed --name 550W --hidden-import webview.platforms.edgechromium --add-data "app;app" app.py

      - name: Build Inno Setup installer
        working-directory: desktop-lite
        run: |
          choco install innosetup -y
          iscc setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: 550W-Setup-Lite
          path: desktop-lite/Output/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lite-v1.${{ github.run_number }}
          name: 550W 桌面版（轻量版）v1.${{ github.run_number }}
          body: |
            550W 综合指挥系统 · Windows 轻量安装包（约 20MB，下载快）
            - 使用系统自带浏览器内核（Windows 10/11 64 位）
            - 双击 setup 安装，桌面生成 550W 图标
            - 独立窗口运行，内置本地服务，Python 编程功能可用
          files: desktop-lite/Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
